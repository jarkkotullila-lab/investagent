name: UI Acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install backend, frontend, and Robot dependencies
        run: |
          uv sync --locked --project backend
          npm ci --prefix frontend
          python -m pip install -r tests/robot/requirements.txt -r tests/robot/requirements-ui.txt
      - name: Install Chromium
        run: rfbrowser init --with-deps chromium
      - name: Start backend and frontend
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/robot-ui-results"
          backend/.venv/bin/uvicorn investagent.main:app --app-dir backend/src --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/investagent-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/investagent-api.pid"
          frontend/node_modules/.bin/vite frontend --config frontend/vite.config.ts --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/investagent-frontend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/investagent-frontend.pid"

          api_ready=0
          frontend_ready=0
          attempt=0
          while [ "$attempt" -lt 30 ]; do
            attempt=$((attempt + 1))
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:8000/api/v1/health > /dev/null; then
              api_ready=1
            fi
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:5173/ > /dev/null; then
              frontend_ready=1
            fi
            if [ "$api_ready" -eq 1 ] && [ "$frontend_ready" -eq 1 ]; then
              break
            fi
            sleep 1
          done

          if [ "$api_ready" -ne 1 ] || [ "$frontend_ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/investagent-api.log"
            cat "$RUNNER_TEMP/investagent-frontend.log"
            exit 1
          fi
      - name: Run Robot Framework UI acceptance tests
        run: |
          robot \
            --outputdir "$RUNNER_TEMP/robot-ui-results" \
            --variable FRONTEND_BASE_URL:http://127.0.0.1:5173 \
            tests/robot/suites/ui
      - name: Stop backend and frontend
        if: always()
        run: |
          set -euo pipefail
          cleanup_status=0
          for name in investagent-api investagent-frontend; do
            pid_file="$RUNNER_TEMP/$name.pid"
            if [ ! -f "$pid_file" ]; then
              continue
            fi

            server_pid="$(cat "$pid_file")"
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              remaining=10
              while [ "$remaining" -gt 0 ] && kill -0 "$server_pid" 2>/dev/null; do
                sleep 1
                remaining=$((remaining - 1))
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                echo "Process $server_pid did not stop in time."
                cleanup_status=1
              fi
            fi
          done
          exit "$cleanup_status"
      - name: Upload UI acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-ui-results
          path: |
            ${{ runner.temp }}/robot-ui-results/
            ${{ runner.temp }}/investagent-api.log
            ${{ runner.temp }}/investagent-frontend.log
          if-no-files-found: warn
