name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked --project backend

      - name: Run Ruff
        run: uv run --locked ruff check src tests
        working-directory: backend

      - name: Run Pytest
        run: uv run --locked pytest
        working-directory: backend

      - name: Run Robot Framework API tests
        run: |
          backend/.venv/bin/uvicorn investagent.main:app \
            --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/investagent-api.log" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" > "$RUNNER_TEMP/investagent-api.pid"
          if ! curl --fail --silent --show-error --retry 30 --retry-connrefused \
            --retry-delay 1 --max-time 2 http://127.0.0.1:8000/api/v1/health \
            > /dev/null; then
            cat "$RUNNER_TEMP/investagent-api.log"
            exit 1
          fi
          uv run --no-project --python 3.12 \
            --with-requirements tests/robot/requirements.txt robot \
            --variable API_BASE_URL:http://127.0.0.1:8000 \
            tests/robot/suites/api/health.robot

      - name: Stop FastAPI
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/investagent-api.pid"
          if [ -f "$pid_file" ]; then
            server_pid="$(cat "$pid_file")"
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              for attempt in $(seq 1 10); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  exit 0
                fi
                sleep 1
              done
              echo "FastAPI server PID $server_pid did not stop." >&2
              exit 1
            fi
          fi

      - name: Upload Robot Framework reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-reports
          path: |
            output.xml
            log.html
            report.html
          if-no-files-found: warn
